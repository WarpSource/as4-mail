<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC '-//W3C//DTD XHTML 1.0 Transitional//EN'
        'http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd'>
<html xmlns='http://www.w3.org/1999/xhtml'
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      lang="#{localeManager.language}"
>

<h:head>
    <title>AS4-Mail - Login page</title>
    <link href="public/login.css" rel="stylesheet"/>

</h:head>
<f:view locale="#{localeManager.locale}" transient="true">
    <h:body class="LoginPage">

        <div class="LoginTitle"></div>

        <p:panel id="loginPanel" class="LoginPanel" header="#{msg['Login']}">
            <h:form action="j_security_check" id="loginForm">
                <p:messages class="ui-messages-error" />
                <div style="width:100%; display: flex; flex-flow: column wrap;">
                    <p:outputLabel for="username" value="#{msg['Username']}"/>
                    <p:inputText id="username" value="#{loginManager.username}" required="true"
                                 label="#{msg['Username']}"
                                 requiredMessage="#{msg['EnterUsername']}"
                    />
                </div>
                <br/>
                <div style="padding:0.1em 0.2em; width:100%; display: flex; flex-flow: column wrap;">
                    <p:outputLabel for="password" value="#{msg['Password']}"/>
                    <p:password id="password" value="#{loginManager.password}"
                                required="true"
                                requiredMessage="#{msg['EnterPassword']}"/>
                </div>

                <p:commandButton id="loginButton" widgetVar="loginButton" value="#{msg['Login']}"
                                 style="float:right;margin-top: 2em;font-size:1.5em"
                                 actionListener="#{loginManager.login()}"
                                 icon="pi pi-sign-in"
                                 onclick="PF('loginButton').disable()"
                                 update="@form"/>

            </h:form>
        </p:panel>
        <p:blockUI block=":loginForm"
                   trigger=":loginForm:loginButton"
        >
            <h:graphicImage value="#{resource['images:/ajax-progress.gif']}"/>
            <h:outputText value="#{msg['Login']}"/>
        </p:blockUI>

        <div style="text-align:center; border:1px gray solid; position: fixed; bottom: 0; width: 100%; color: gray; font-size:font-size:1.2em">
            <p:outputLabel value="as4-mail"/> #{msg['Version']}: <p:outputLabel value="#{ApplicationData.buildVersion}"/>
        </div>
    </h:body>
</f:view>
</html>
