<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:p="http://primefaces.org/ui"
      xmlns:composite="http://xmlns.jcp.org/jsf/composite"
      lang="#{localeManager.language}"
>
<h:head>
    <title>Input text</title>
</h:head>
<composite:interface>
    <cc:attribute name="id" type="java.lang.String"/>
    <cc:attribute name="label" type="java.lang.String" default="Required value!"/>
    <cc:attribute name="required" type="java.lang.Boolean" default="false"/>
    <cc:attribute name="requiredMessage" type="java.lang.String" default="Required value!"/>
</composite:interface>

<composite:implementation>
    <p:outputLabel for="#{cc.attrs.id}" value="#{msg[#{cc.attrs.label}]}"/>
    <p:inputText id="username" value="#{loginManager.username}" required="#{cc.attrs.required}"
                 label="#{msg[#{cc.attrs.id}]}"
                 requiredMessage="#{msg[{#cc.attrs.required}]}"
    />
    <p:message for="#{cc.attrs.id}"/>
</composite:implementation>

</html>
